<!DOCTYPE html>
<html>
<head>
    <title>Temple Donation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 40px;
        }

        .box {
            background: white;
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            color: #234b70;
            text-align: center;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 95%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            background: #234b70;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #16334f;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Temple Donation</h2>

    <form action="result.jsp" method="post">
        Name:
        <input type="text" name="name" required>

        Amount (Rs.):
        <input type="number" name="amount" min="1" required>

        Purpose:
        <input type="text" name="purpose" required>

        Date:
        <input type="date" name="date" required>

        <input type="submit" value="Save Donation">
    </form>
</div>

</body>
</html>
